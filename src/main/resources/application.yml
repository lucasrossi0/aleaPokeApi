spring:
  application:
    name: pokemon-rankings

pokeapi:
  base-url: https://pokeapi.co/api/v2
  connect-timeout: 5s
  read-timeout: 10s
  max-attempts: 3
  retry-delay: 500ms
  max-concurrent-calls: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,rankings
  info:
    env:
      enabled: true

info:
  app:
    name: Pokemon Rankings
    description: Top 5 heaviest, highest and most experienced Pokemon
