spring:
  application:
    name: pokemon-rankings

# Everything we need to talk to PokéAPI. Only the client package reads these.
pokeapi:
  base-url: https://pokeapi.co/api/v2
  connect-timeout: 5s
  read-timeout: 10s
  # How many times we try each Pokémon call before giving up on it
  max-attempts: 3
  # Pause between two attempts of the same call
  retry-delay: 500ms
  # How many calls can be in flight at the same time
  max-concurrent-calls: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # "rankings" is our own health indicator: not UP until the rankings are loaded
        readiness:
          include: readinessState,rankings
  info:
    env:
      enabled: true

info:
  app:
    name: Pokemon Rankings
    description: Top 5 heaviest, highest and most experienced Pokemon
