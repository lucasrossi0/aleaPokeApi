info:
  name: Error - POST Not Allowed
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/pokemon/heaviest"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "405"
    - expression: res.body.status
      operator: eq
      value: "405"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
