info:
  name: Info
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/actuator/info"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.app.name
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
