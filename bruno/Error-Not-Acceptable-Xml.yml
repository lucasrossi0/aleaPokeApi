info:
  name: Error - Not Acceptable XML
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/pokemon/heaviest"
  headers:
    - name: Accept
      value: application/xml
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "406"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
