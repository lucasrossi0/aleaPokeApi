info:
  name: Heaviest
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/pokemon/heaviest"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: eq
      value: "5"
    - expression: res.body[0].name
      operator: isString
    - expression: res.body[0].weight
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
